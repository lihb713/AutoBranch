操作块 订单审批:
  Sequence:
    - Step:
        action: 打开页面 "http://127.0.0.1:8123/index.html"
        expect: 页面出现"登录"
    - Step:
        action: 在"用户名"输入框输入 admin
        expect: 输入成功
    - Step:
        action: 在"密码"输入框输入 secret
        expect: 输入成功
    - Step:
        action: 点击"登录"按钮
        expect: 页面出现"登录成功"
    - Step:
        action: 提取第一行的"订单号"文本
        expect: 提取结果非空
    - Step:
        action: 点击第一行的"批准"按钮
        expect: 该行状态变为"已批准"