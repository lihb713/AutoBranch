<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>WebOps 测试站</title>
</head>
<body>
  <h1>WebOps 测试站</h1>

  <section id="login-form">
    <h2>登录</h2>
    <form id="login" action="/login" method="post">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码">
      <button type="submit" id="login-btn">登录</button>
    </form>
    <p id="login-result"></p>
  </section>

  <section id="order-list">
    <h2>订单列表</h2>
    <table id="orders">
      <thead>
        <tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr data-order-id="ORD-001">
          <td class="order-id" id="order-id-1">ORD-001</td><td id="customer-1">甲公司</td><td class="amount" id="amount-1">¥98.00</td>
          <td class="status" id="status-1">待审批</td>
          <td><button class="approve-btn" id="approve-btn-1" data-id="ORD-001">批准</button></td>
        </tr>
        <tr data-order-id="ORD-002">
          <td class="order-id" id="order-id-2">ORD-002</td><td id="customer-2">乙公司</td><td class="amount" id="amount-2">¥152.00</td>
          <td class="status" id="status-2">待审批</td>
          <td><button class="approve-btn" id="approve-btn-2" data-id="ORD-002">批准</button></td>
        </tr>
      </tbody>
    </table>
  </section>

  <script>
    // 模拟登录与批准（不真实提交，前端直接改状态）
    document.getElementById("login").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("username").value;
      var p = document.getElementById("password").value;
      if (u === "admin" && p === "secret") {
        document.getElementById("login-result").textContent = "登录成功，欢迎 admin";
      } else {
        document.getElementById("login-result").textContent = "密码错误";
      }
    });
    document.querySelectorAll(".approve-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.dataset.id;
        var row = document.querySelector('tr[data-order-id="' + id + '"]');
        row.querySelector(".status").textContent = "已批准";
        row.querySelector(".approve-btn").disabled = true;
      });
    });
  </script>
</body>
</html>
