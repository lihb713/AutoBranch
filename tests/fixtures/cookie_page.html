<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>WebOps Cookie 冷启动测试页</title>
</head>
<body>
  <h1>WebOps Cookie 冷启动测试页</h1>
  <p>本页在加载时写入 cookie 与 localStorage。</p>
  <script>
    document.cookie = "webops_test_cookie=abc; path=/";
    localStorage.setItem("webops_test_key", "abc");
  </script>
</body>
</html>
